name: Poll Weather

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Call protected weather poll route
        run: |
          set -euo pipefail
          response=$(curl --silent --show-error \
            -w "\n%{http_code}" \
            -X GET "${{ secrets.APP_URL }}/api/cron/poll-weather" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          body=$(printf '%s\n' "$response" | sed '$d')
          code=$(printf '%s\n' "$response" | tail -n1)
          echo "HTTP $code"
          echo "$body"
          test "$code" -lt 400
