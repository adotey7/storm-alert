name: Poll Weather

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Call protected weather poll route
        run: |
          curl --fail --show-error --silent \
            -X GET "${{ secrets.APP_URL }}/api/cron/poll-weather" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
